{% extends "base.html" %}

{% block title %}Donor Operating Portal — SANJOG{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-black text-slate-900">Donor Operating Dashboard</h1>
            <p class="text-xs text-slate-500 mt-1">Logged in as: <span class="font-bold text-primary-700">{{ user.username }}</span> (Food Donor)</p>
        </div>
        <span class="px-3 py-1 bg-green-100 text-green-800 rounded-full text-xs font-bold border border-green-300">
            ROLE: DONOR
        </span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white p-6 rounded-xl border border-slate-200 text-center space-y-2">
            <span class="text-xs text-slate-500 font-semibold uppercase">Total Surplus Posted</span>
            <p class="text-3xl font-black text-primary-700">0</p>
        </div>
        <div class="bg-white p-6 rounded-xl border border-slate-200 text-center space-y-2">
            <span class="text-xs text-slate-500 font-semibold uppercase">Active Rescues</span>
            <p class="text-3xl font-black text-amber-600">0</p>
        </div>
        <div class="bg-white p-6 rounded-xl border border-slate-200 text-center space-y-2">
            <span class="text-xs text-slate-500 font-semibold uppercase">Meals Delivered</span>
            <p class="text-3xl font-black text-slate-900">0</p>
        </div>
    </div>
</div>
{% endblock %}
