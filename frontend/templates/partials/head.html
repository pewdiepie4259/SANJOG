<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sanjog — Community Food Rescue Network{% endblock %}</title>
    
    <!-- Sanjog Official Favicon in Title Bar -->
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/static/images/favicon-64.png">
    <link rel="shortcut icon" href="/static/images/favicon.ico">
    <link rel="apple-touch-icon" href="/static/images/sanjog_icon_192.png">

    <!-- Google Fonts: Plus Jakarta Sans & Fraunces -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500;1,9..144,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 Icons (Free CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', '-apple-system', 'sans-serif'],
                        serif: ['"Fraunces"', 'Georgia', 'serif'],
                    },
                    colors: {
                        // PISTA GREEN: Fresh, lively pastel pistachio green with grounded depth
                        pista: {
                            50: '#F3F9EE',
                            100: '#E4F2DC',
                            200: '#CBE5BD',
                            300: '#ADD498',
                            400: '#8EBE72',
                            500: '#75A856',
                            600: '#5F8E43',
                            700: '#486E31',
                            800: '#345222',
                            900: '#213614',
                            950: '#14230B',
                        },
                        // IVORY: Warm, rich creamy canvas and surfaces
                        ivory: {
                            50: '#FDFCF9',
                            100: '#FAF7F0',
                            200: '#F4EFE3',
                            300: '#EAE2D2',
                            400: '#DDD2BD',
                            500: '#C6B69A',
                            600: '#9B8B6E',
                            700: '#706249',
                            800: '#4A3F2C',
                            900: '#241E13',
                            950: '#151109',
                        },
                        // SALMON PINK: Inviting, warm coral-salmon for vital actions & highlights
                        salmon: {
                            50: '#FFF5F3',
                            100: '#FFE8E4',
                            200: '#FFD2CA',
                            300: '#FFB3A5',
                            400: '#FF8E7C',
                            500: '#FA705C',
                            600: '#E4503B',
                            700: '#BA3724',
                            800: '#8C2415',
                            900: '#5A130A',
                            950: '#380B05',
                        }
                    },
                    boxShadow: {
                        'soft': '0 2px 12px -2px rgba(36, 30, 19, 0.06), 0 4px 20px -4px rgba(117, 168, 86, 0.08)',
                        'hover': '0 8px 30px -4px rgba(36, 30, 19, 0.1), 0 6px 18px -4px rgba(250, 112, 92, 0.12)',
                        'pista': '0 4px 20px -2px rgba(117, 168, 86, 0.28)',
                        'salmon': '0 4px 20px -2px rgba(250, 112, 92, 0.28)',
                    }
                }
            }
        }
    </script>
    
    <!-- HTMX Library -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt9ApKC1BHgZEapYawvhYlFoajjVqJKXUew+OrQ6VRjIE3fpbwgGU0RjFzpLk" crossorigin="anonymous"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/input.css">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FAF7F0;
            color: #241E13;
            -webkit-font-smoothing: antialiased;
        }

        ::selection {
            background-color: #E4F2DC;
            color: #213614;
        }

        /* Custom smooth scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F4EFE3;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBE5BD;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8EBE72;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
