<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sanjog — Community Food Rescue Network{% endblock %}</title>
    
    <!-- Sanjog Official Favicon in Title Bar -->
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/static/images/favicon-64.png">
    <link rel="shortcut icon" href="/static/images/favicon.ico">
    <link rel="apple-touch-icon" href="/static/images/sanjog_icon_192.png">

    <!-- Google Fonts: Plus Jakarta Sans & Fraunces -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500;1,9..144,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 Icons (Free CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    spacing: {
                        '4.5': '1.125rem',
                        '5.5': '1.375rem',
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', '-apple-system', 'sans-serif'],
                        serif: ['"Fraunces"', 'Georgia', 'serif'],
                    },
                    colors: {
                        // YELLOW-GREEN (#BAFF39): Vibrant, energetic modern accent
                        pista: {
                            50: '#F8FEEB',
                            100: '#EFFFCE',
                            200: '#DFFB96',
                            300: '#CFF85E',
                            400: '#C2F735',
                            500: '#BAFF39', // Exact User Yellow-Green
                            600: '#9FE019',
                            700: '#7BB30C',
                            800: '#578207',
                            900: '#2F4703',
                            950: '#172601',
                        },
                        // WHITE (#FFFFFF) & CRISP GREYS: Clean, high-contrast canvas & surfaces
                        ivory: {
                            50: '#FFFFFF', // Exact User Pure White
                            100: '#FFFFFF', // Clean White background
                            200: '#F5F5F5',
                            300: '#E5E5E5',
                            400: '#D4D4D4',
                            500: '#9E9E9E',
                            600: '#6E6E6E', // Exact User Dim Grey
                            700: '#525252',
                            800: '#383838',
                            900: '#1F1F1F',
                            950: '#111111',
                        },
                        // DIM GREY (#6E6E6E): Neutral dim grey highlights, secondary buttons & badges
                        salmon: {
                            50: '#F8F8F8',
                            100: '#EEEEEE',
                            200: '#DDDDDD',
                            300: '#C7C7C7',
                            400: '#8E8E8E',
                            500: '#6E6E6E', // Exact User Dim Grey
                            600: '#555555',
                            700: '#3E3E3E',
                            800: '#2A2A2A',
                            900: '#1A1A1A',
                            950: '#0D0D0D',
                        },
                        // Named convenience aliases
                        yellowgreen: '#BAFF39',
                        dimgrey: '#6E6E6E',
                    },
                    boxShadow: {
                        'soft': '0 2px 12px -2px rgba(110, 110, 110, 0.08), 0 4px 20px -4px rgba(186, 255, 57, 0.15)',
                        'hover': '0 8px 30px -4px rgba(110, 110, 110, 0.14), 0 6px 18px -4px rgba(186, 255, 57, 0.22)',
                        'pista': '0 4px 20px -2px rgba(186, 255, 57, 0.40)',
                        'salmon': '0 4px 20px -2px rgba(110, 110, 110, 0.35)',
                    }
                }
            }
        }
    </script>
    
    <!-- Leaflet 1.9.4 (Interactive Geospatial Maps) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- HTMX Library -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt9ApKC1BHgZEapYawvhYlFoajjVqJKXUew+OrQ6VRjIE3fpbwgGU0RjFzpLk" crossorigin="anonymous"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/input.css">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FFFFFF;
            color: #1F1F1F;
            -webkit-font-smoothing: antialiased;
        }

        ::selection {
            background-color: #BAFF39;
            color: #111111;
        }

        /* Custom smooth scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F5F5F5;
        }
        ::-webkit-scrollbar-thumb {
            background: #6E6E6E;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #525252;
        }

        /* High-contrast legibility for Yellow-Green (#BAFF39) primary action buttons */
        .bg-pista-500, .bg-pista-600 {
            color: #111111 !important;
        }
        .bg-pista-500 svg, .bg-pista-600 svg, .bg-pista-500 i, .bg-pista-600 i {
            color: #111111 !important;
        }
        .bg-pista-600:hover, .bg-pista-500:hover {
            background-color: #A3EE1E !important;
            color: #000000 !important;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
