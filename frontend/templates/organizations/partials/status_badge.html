{% if status == 'APPROVED' %}
    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-300">
        <span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-emerald-600"></span>
        Approved & Verified
    </span>
{% elif status == 'PENDING' %}
    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-300">
        <span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-amber-600 animate-pulse"></span>
        Pending Review
    </span>
{% elif status == 'REJECTED' %}
    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-100 text-rose-800 border border-rose-300">
        <span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-rose-600"></span>
        Rejected
    </span>
{% else %}
    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-300">
        <span class="w-1.5 h-1.5 mr-1.5 rounded-full bg-slate-500"></span>
        Draft / Incomplete
    </span>
{% endif %}
