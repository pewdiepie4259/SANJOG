{% extends "base.html" %}

{% block title %}Reset Password — SANJOG Food Rescue OS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 bg-white p-8 rounded-2xl shadow-md border border-slate-200">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-black text-slate-900">Forgot Password?</h2>
        <p class="text-xs text-slate-500 mt-1">Enter your registered email address below to receive password reset instructions.</p>
    </div>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1" for="id_email">Email Address</label>
            <input type="email" name="email" id="id_email" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-primary-500 text-sm" placeholder="org@example.com">
        </div>

        <button type="submit" class="w-full bg-primary-700 hover:bg-primary-900 text-white font-bold py-3 px-4 rounded-xl shadow transition-all text-sm">
            Send Reset Instructions
        </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-200 text-center text-xs text-slate-600">
        Remembered password? <a href="{% url 'login' %}" class="font-bold text-primary-700 hover:underline">Back to Login</a>
    </div>
</div>
{% endblock %}
