{% extends "base.html" %}

{% block title %}Reset Link Sent — Sanjog{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 bg-ivory-50 p-8 rounded-3xl shadow-sm border border-ivory-300/80 text-center space-y-4">
    <div class="w-14 h-14 bg-pista-100 text-pista-700 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold border border-pista-200 shadow-xs">
        <i class="fa-solid fa-envelope-circle-check"></i>
    </div>
    <h2 class="text-2xl font-serif font-bold text-pista-950">Check Your Email</h2>
    <p class="text-xs text-pista-800/80 leading-relaxed">
        If an account exists with the email address you entered, a password reset link has been sent. Please check your inbox and spam folder.
    </p>
    <div class="pt-4 border-t border-ivory-200">
        <a href="{% url 'login' %}" class="inline-flex items-center gap-2 text-xs font-bold text-pista-700 hover:text-pista-900 hover:underline">
            <i class="fa-solid fa-arrow-left text-xs"></i>
            <span>Return to Login</span>
        </a>
    </div>
</div>
{% endblock %}
