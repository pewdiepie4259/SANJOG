{% extends "base.html" %}

{% block title %}Password Reset Complete — SANJOG Food Rescue OS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 bg-white p-8 rounded-2xl shadow-md border border-slate-200 text-center space-y-4">
    <div class="w-12 h-12 bg-green-100 text-green-700 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
        ✓
    </div>
    <h2 class="text-2xl font-black text-slate-900">Password Reset Complete</h2>
    <p class="text-xs text-slate-600">Your password has been successfully updated. You may now log in with your new credentials.</p>
    <div class="pt-4 border-t border-slate-200">
        <a href="{% url 'login' %}" class="inline-block bg-primary-700 hover:bg-primary-900 text-white font-bold py-2.5 px-6 rounded-xl text-xs transition-colors">
            Sign In Now
        </a>
    </div>
</div>
{% endblock %}
