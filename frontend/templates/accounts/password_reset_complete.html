{% extends "base.html" %}

{% block title %}Password Reset Complete — Sanjog{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 bg-ivory-50 p-8 rounded-3xl shadow-sm border border-ivory-300/80 text-center space-y-4">
    <div class="w-14 h-14 bg-pista-100 text-pista-700 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold border border-pista-200 shadow-xs">
        <i class="fa-solid fa-check"></i>
    </div>
    <h2 class="text-2xl font-serif font-bold text-pista-950">Password Reset Complete</h2>
    <p class="text-xs text-pista-800/80 leading-relaxed">Your password has been successfully updated. You may now log in with your new credentials.</p>
    <div class="pt-4 border-t border-ivory-200">
        <a href="{% url 'login' %}" class="inline-flex items-center gap-2 bg-pista-700 hover:bg-pista-800 text-ivory-50 font-bold py-2.5 px-6 rounded-xl text-xs transition-colors shadow-sm">
            <span>Sign In Now</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
        </a>
    </div>
</div>
{% endblock %}
